
buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://maven.parchmentmc.org' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        maven {
            // 阿里云镜像，方便国内开发
            url = uri("https://maven.aliyun.com/repository/public/")
        }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '[6.0.16,6.2)', changing: true
        classpath 'org.parchmentmc:librarian:1.+'
        classpath group: 'org.spongepowered', name: 'mixingradle', version: '0.7-SNAPSHOT'
        classpath 'gradle.plugin.com.github.johnrengelman:shadow:7.1.2'
    }
}

apply plugin: 'eclipse'
apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.parchmentmc.librarian.forgegradle'
apply plugin: 'org.spongepowered.mixin'
apply plugin: 'java'
apply plugin: 'idea'
apply plugin: 'com.github.johnrengelman.shadow'

group = mod_group_id
version = mod_version
archivesBaseName = "${mod_id}-${minecraft_version}-forge"

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    // accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    copyIdeResources = true
    runs {
        configureEach {
            jvmArgs = [
                    "-XX:+IgnoreUnrecognizedVMOptions",
                    "-XX:+AllowEnhancedClassRedefinition"
            ]
            workingDirectory project.file('run')
            arg "-mixin.config=" + "${mod_id}" + ".mixins.json"
            // 灾变（L_Ender's Cataclysm）兼容补丁单独一份配置，没装灾变时不影响本模组加载
            arg "-mixin.config=" + "${mod_id}" + ".cataclysm.mixins.json"
            // 星露谷钓鱼（stardew_fishing）自动模式兼容，没装该模组时不影响本模组加载
            arg "-mixin.config=" + "${mod_id}" + ".stardew.mixins.json"
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }
        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }
        data {
            workingDirectory project.file('run')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

mixin {
    add sourceSets.main, "${mod_id}" + '.mixin-refmap.json'
    config "${mod_id}" + '.mixins.json'
    // 灾变（L_Ender's Cataclysm）兼容补丁
    config "${mod_id}" + '.cataclysm.mixins.json'
    // 星露谷钓鱼（stardew_fishing）自动模式兼容
    config "${mod_id}" + '.stardew.mixins.json'
}

repositories {
    flatDir {
        dirs 'libs'
    }
    // 本地 maven 镜像：cursemaven 上的女仆 1.5.3（8061847）在构建机下载会超时，
    // 这里放同一份 jar，坐标仍然是 curse.maven:touhou-little-maid-355044:8061847
    maven {
        url = uri("libs/maven")
    }
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    // playerAnimator：铁魔法用的 player 动画库，Boss 复用施法动画需要它
    maven { url = "https://maven.kosmx.dev/" }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    // 女仆模组：8061847 对应 1.5.3，与整合包实际运行版本一致
    implementation fg.deobf("curse.maven:touhou-little-maid-355044:8061847")
    implementation fg.deobf("curse.maven:maidswordsoaring-1334387:6978523")
    implementation fg.deobf("curse.maven:puzzles-lib-495476:6918565")
    implementation fg.deobf("curse.maven:jade-324717:6855440")
    implementation fg.deobf("curse.maven:irons-spells-n-spellbooks-855414:7605614")
    implementation fg.deobf("curse.maven:ldlib-626676:7652228")
    implementation fg.deobf("curse.maven:wishing-fountain-1255471:6873585")
    implementation fg.deobf("curse.maven:mantle-74924:7563777")
    implementation fg.deobf("curse.maven:tinkers-construct-74072:7449219")
    implementation fg.deobf("curse.maven:astages-1120180:7889277")
    implementation fg.deobf(files(
            "libs/fast_irons_spellbooks_addition-1.20.1-forge-0.0.1.jar",
            // 晴雪UI（ApricityUI）：商店系统用它渲染 HTML 界面，缺失时自动回落到原版 ShopScreen
            "libs/ApricityUI-forge-1.20.1-1.2.7.jar"
    ))
    // JEI：只做编译期依赖（@JeiPlugin 由 JEI 自己按注解扫描，不需要我们注册）。
    // 直接对着实例里实际运行的那份 jar 编译，避免 curse 上版本和整合包不一致；
    // 没装 JEI 时这些类不会被加载，模组照常启动。
    compileOnly files("libs/jei-1.20.1-forge-15.20.0.129.jar")
    // playerAnimator：铁魔法用的 player 动画库，Boss 复用施法动画需要它
    implementation fg.deobf("dev.kosmx.player-anim:player-animation-lib-forge:1.0.2-rc1+1.20")
    // TACZ：幻影勇者要拿 AWM 狙击枪，用它的 IGunOperator 开枪
    // （和女仆模组用的是同一个 curse.maven 坐标，可离线解析）
    implementation fg.deobf("curse.maven:timeless-and-classics-zero-1028108:7401617")
}

processResources {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

jar {
    manifest {
        attributes([
                "Implementation-Title"  : project.name,
                "Implementation-Version": "${version}",
                "MixinConfigs"            : "${mod_id}" + ".mixins.json" + "," + "${mod_id}" + ".cataclysm.mixins.json" + "," + "${mod_id}" + ".stardew.mixins.json"
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // 灾变（L_Ender's Cataclysm）是第三方模组，没有加入编译依赖。
    // 它的 mixin 目标类写在 @Mixin(targets="...") 里，注解处理器默认会因「找不到目标类」而报错。
    //   MSG_MIXIN_SOFT_TARGET_NOT_FOUND=warning  把这个报错降级为警告
    //   disableTargetValidator                   跳过对目标类的注入点校验
    // 注入点全部使用 remap = false 的 SRG 字面量，不需要生成 refmap，因此关闭校验是安全的。
    options.compilerArgs += [
            '-AMSG_MIXIN_SOFT_TARGET_NOT_FOUND=warning',
            '-AdisableTargetValidator'
    ]
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}